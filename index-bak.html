<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1a16" />

    <!-- 基础元信息：静态写入，保证不执行 JS 的抓取器也能读到 -->
    <title>ORA Head Spa | Herbal Scalp &amp; Skin Care in Waltham, MA</title>
    <meta
      name="description"
      content="ORA is a herbal head spa in Waltham, Massachusetts. Botanical scalp and skin rituals, one-to-one care and a quiet space — choose a 60–90 minute session and book online."
    />
    <link rel="canonical" href="https://www.myoraspa.com/preview" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / 社交与 AI 摘要预览 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ORA Head Spa" />
    <meta
      property="og:title"
      content="ORA Head Spa | Herbal Scalp &amp; Skin Care in Waltham, MA"
    />
    <meta
      property="og:description"
      content="Botanical scalp and skin rituals in Waltham, Massachusetts. One-to-one herbal head spa sessions, 60–90 minutes, book online."
    />
    <meta property="og:url" content="https://www.myoraspa.com/preview" />
    <meta property="og:image" content="https://www.myoraspa.com/images/storefront.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ORA Head Spa | Herbal Scalp &amp; Skin Care in Waltham, MA"
    />
    <meta
      name="twitter:description"
      content="Botanical scalp and skin rituals in Waltham, Massachusetts. One-to-one herbal head spa sessions, 60–90 minutes, book online."
    />
    <meta name="twitter:image" content="https://www.myoraspa.com/images/storefront.jpg" />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
